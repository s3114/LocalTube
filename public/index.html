<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>LocalTube</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --panel: #181818;
            --border: #303030;
            --text: #f1f1f1;
            --subtext: #aaa;
            --accent: #ff0000;
            --warn: #ff9800;
            --green: #4caf50;
            --blue: #2196f3;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 56px;
            background: var(--panel);
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }
        .logo { font-size: 18px; font-weight: bold; }
        .logo span { color: var(--accent); }
        main {
            max-width: 900px;
            margin: 80px auto 40px;
            padding: 0 16px;
        }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .url-box { display: flex; gap: 10px; }
        .url-box textarea, .url-box input {
            flex: 1;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-family: "Segoe UI", Roboto, sans-serif;
            resize: vertical;
            min-height: 50px;
        }
        .url-box button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 0 20px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
            align-self: flex-start;
            height: 50px;
        }
        .options { margin-top: 20px; display: grid; gap: 14px; }
        select {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
        }
        input[type="range"] {
            appearance: none;
            -webkit-appearance: none;
            width: 48%;
            height: 8px;
            background: #555;
            border-radius: 5px;
            outline: none;
            margin-top: 10px;
        }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 1px solid var(--border); }
        input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 1px solid var(--border); }
        .toggle { display: flex; justify-content: space-between; align-items: center; background: #000; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
        .toggle small { color: var(--subtext); display: block; font-size: 12px; }
        .switch { position: relative; width: 42px; height: 22px; }
        .switch input { display: none; }
        .slider { position: absolute; inset: 0; background: #555; border-radius: 22px; cursor: pointer; transition: .2s; }
        .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
        input:checked+.slider { background: var(--accent); }
        input:checked+.slider:before { transform: translateX(20px); }
        .warn small { color: var(--warn); }
        #savePath { opacity: 0.9; }

        /* ===== Job Queue ===== */
        #job-queue {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .job-item {
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
            transition: background-color 0.3s;
        }
        .job-status-icon {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .job-details {
            flex-grow: 1;
            overflow: hidden;
        }
        .job-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            color: var(--text);
        }
        .job-progress-bar-container {
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .job-progress-bar {
            height: 100%;
            background: var(--blue);
            width: 0%;
            transition: width 0.2s linear;
        }
        .job-item[data-status="completed"] .job-progress-bar { background: var(--green); }
        .job-item[data-status="error"] .job-progress-bar { background: var(--accent); }
        .job-progress-text {
            font-size: 12px;
            color: var(--subtext);
            margin-top: 4px;
            height: 1.2em;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo"><span>▶</span> LocalTube</div>
    </header>

    <main>
        <div class="card">
            <div class="url-box">
                <textarea id="urls" placeholder="YouTube の URL を1行に1つずつ入力"></textarea>
                <button onclick="start()">DL</button>
            </div>
            <div class="options">
                <select id="fmt">
                    <option
                        value="bv[height=4320][ext=mp4]+ba[ext=m4a]/bv[height=2160][ext=mp4]+ba[ext=m4a]/bv[height=1440][ext=mp4]+ba[ext=m4a]/bv[height=1080][ext=mp4]+ba[ext=m4a]/bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        4320p（7680 x 4320）</option>
                    <option
                        value="bv[height=2160][ext=mp4]+ba[ext=m4a]/bv[height=1440][ext=mp4]+ba[ext=m4a]/bv[height=1080][ext=mp4]+ba[ext=m4a]/bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        2160p（3840 x 2160）</option>
                    <option
                        value="bv[height=1440][ext=mp4]+ba[ext=m4a]/bv[height=1080][ext=mp4]+ba[ext=m4a]/bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        1440p（2560 x 1440）</option>
                    <option
                        value="bv[height=1080][ext=mp4]+ba[ext=m4a]/bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        1080p（1920 x 1080）</option>
                    <option
                        value="bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        720p （1280 x 720 ）</option>
                    <option
                        value="bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        480p （720 x 480 ）</option>
                    <option
                        value="bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        360p （640 x 360 ）</option>
                    <option value="bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        240p （ 426 x 240 ）</option>
                    <option value="bv[height=144][ext=mp4]+ba[ext=m4a]">144p （256 x 144 ）</option>
                </select>


                <div class="url-box">
                    <input type="text" id="savePath" placeholder="保存先フォルダパス (空白の場合、起動.batの親フォルダのdownloadsに保存されます)">
                </div>
                <div class="toggle">
                    <div>
                        並列ダウンロード数: <span id="parallelDownloadsValue">1</span>
                        <small>フラグメントの並列ダウンロード数</small>
                    </div>
                    <input type="range" id="optParallelDownloads" min="1" max="16" value="1">
                </div>
            </div>
            <div class="toggle">
                <div>
                    cookieファイル
                    <small id="cookieFileNameDisplay">ファイルが選択されていません</small>
                </div>
                <input type="file" id="cookiePathSet" accept=".txt" style="display: none;">
                <button onclick="document.getElementById('cookiePathSet').click()" style="background: #333; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; cursor: pointer;">選択</button>
            </div>
            <div class="toggle">
                <div>
                    ダウンロード履歴を保存
                    <small>再度同じ動画がダウンロードされないようになります。</small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="optHistory" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle">
                <div>
                    サムネイルをダウンロード
                    <small>動画一覧・再生画面で使用</small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="optThumb" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="toggle">
                <div>
                    DRM 保護を回避
                    <div class="warn">
                        <small>非推奨（必要なときのみ使用してください。）詳しくは<a
                                href="https://github.com/yt-dlp/yt-dlp/issues/12563">こちら</a>(英語)</small>
                    </div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="optDrm">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div id="job-queue"></div>
    </main>

    <script>
        // --- Global State ---
        const jobStates = new Map();

        // --- Helper Functions ---
        function getStatusIcon(status) {
            switch (status) {
                case 'queued': return '🕒'; // Clock
                case 'downloading': return '⬇️'; // Down arrow
                case 'completed': return '✅'; // Check mark
                case 'error': return '❌'; // Cross mark
                default: return '❔'; // Question mark
            }
        }
        
        function renderJob(job) {
            jobStates.set(job.id, job);
            const statusIcon = getStatusIcon(job.status);
            const progressText = job.status === 'downloading'
                ? `${job.progress.percentage}% of ${job.progress.totalSize} at ${job.progress.speed} ETA ${job.progress.eta}`
                : (job.progress.eta || job.status);

            return `
                <div class="job-item" id="job-${job.id}" data-status="${job.status}">
                    <div class="job-status-icon">${statusIcon}</div>
                    <div class="job-details">
                        <div class="job-title" title="${job.title}">${job.title}</div>
                        <div class="job-progress-bar-container">
                            <div class="job-progress-bar" style="width: ${job.progress.percentage || 0}%;"></div>
                        </div>
                        <div class="job-progress-text">${progressText}</div>
                    </div>
                </div>
            `;
        }

        function updateJobElement(job) {
            const jobElement = document.getElementById(`job-${job.id}`);
            if (!jobElement) return;

            jobElement.dataset.status = job.status;
            jobElement.querySelector('.job-status-icon').textContent = getStatusIcon(job.status);
            jobElement.querySelector('.job-title').textContent = job.title;
            jobElement.querySelector('.job-title').title = job.title;
            
            const progressBar = jobElement.querySelector('.job-progress-bar');
            const progressTextElement = jobElement.querySelector('.job-progress-text');
            
            let progressText = '';
            if (job.status === 'downloading') {
                progressBar.style.width = `${job.progress.percentage}%`;
                progressText = `${job.progress.percentage}% of ${job.progress.totalSize} at ${job.progress.speed} ETA ${job.progress.eta}`;
            } else if (job.status === 'completed') {
                progressBar.style.width = '100%';
                progressText = job.progress.eta || '完了';
            } else if (job.status === 'error') {
                progressBar.style.width = '100%';
                progressText = job.progress.eta || 'エラー';
            } else {
                 progressBar.style.width = '0%';
                 progressText = job.progress.eta || job.status;
            }
            progressTextElement.textContent = progressText;
        }

        // --- Main Logic ---
        document.addEventListener('DOMContentLoaded', () => {
            // --- Settings Persistence ---
            function saveSetting(key, value) { localStorage.setItem(key, value); }
            function loadSetting(key, defaultValue) {
                const storedValue = localStorage.getItem(key);
                if (storedValue === null) return defaultValue;
                if (defaultValue === true || defaultValue === false) return storedValue === 'true';
                return storedValue;
            }

            const elements = {
                fmt: document.getElementById('fmt'),
                savePath: document.getElementById('savePath'),
                optHistory: document.getElementById('optHistory'),
                optThumb: document.getElementById('optThumb'),
                optDrm: document.getElementById('optDrm'),
                optParallelDownloads: document.getElementById('optParallelDownloads'),
                parallelDownloadsValue: document.getElementById('parallelDownloadsValue'),
                cookiePathSet: document.getElementById('cookiePathSet'),
                cookieFileNameDisplay: document.getElementById('cookieFileNameDisplay'),
                urls: document.getElementById('urls'),
                jobQueue: document.getElementById('job-queue')
            };

            elements.fmt.value = loadSetting('fmt', elements.fmt.value);
            elements.savePath.value = loadSetting('savePath', elements.savePath.value);
            elements.optHistory.checked = loadSetting('optHistory', elements.optHistory.checked);
            elements.optThumb.checked = loadSetting('optThumb', elements.optThumb.checked);
            elements.optDrm.checked = loadSetting('optDrm', false); // デフォルトはfalse
            const loadedParallel = loadSetting('optParallelDownloads', elements.optParallelDownloads.value);
            elements.optParallelDownloads.value = loadedParallel;
            elements.parallelDownloadsValue.textContent = loadedParallel;

            elements.fmt.addEventListener('change', (e) => saveSetting('fmt', e.target.value));
            elements.savePath.addEventListener('input', (e) => saveSetting('savePath', e.target.value));
            elements.optHistory.addEventListener('change', (e) => saveSetting('optHistory', e.target.checked));
            elements.optThumb.addEventListener('change', (e) => saveSetting('optThumb', e.target.checked));
            elements.optDrm.addEventListener('change', (e) => saveSetting('optDrm', e.target.checked));
            elements.optParallelDownloads.addEventListener('input', (e) => {
                elements.parallelDownloadsValue.textContent = e.target.value;
                saveSetting('optParallelDownloads', e.target.value);
            });
            elements.cookiePathSet.addEventListener('change', e => {
                const file = e.target.files[0];
                elements.cookieFileNameDisplay.textContent = file ? file.name : 'ファイルが選択されていません';
                window.selectedCookieFile = file || null;
            });

            // --- SSE Connection ---
            const eventSource = new EventSource('/events');

            eventSource.addEventListener('initial_state', (e) => {
                const jobs = JSON.parse(e.data);
                elements.jobQueue.innerHTML = '';
                jobs.forEach(job => {
                    elements.jobQueue.insertAdjacentHTML('beforeend', renderJob(job));
                });
            });

            eventSource.addEventListener('jobs_added', (e) => {
                const newJobs = JSON.parse(e.data);
                newJobs.forEach(job => {
                     elements.jobQueue.insertAdjacentHTML('beforeend', renderJob(job));
                });
            });

            eventSource.addEventListener('title_update', (e) => {
                const { id, title } = JSON.parse(e.data);
                const job = jobStates.get(id);
                if (job) {
                    job.title = title;
                    updateJobElement(job);
                }
            });

            eventSource.addEventListener('progress_update', (e) => {
                const { id, progress } = JSON.parse(e.data);
                const job = jobStates.get(id);
                if (job) {
                    job.progress = progress;
                    updateJobElement(job);
                }
            });

            eventSource.addEventListener('status_update', (e) => {
                const { id, status, progress } = JSON.parse(e.data);
                const job = jobStates.get(id);
                if (job) {
                    job.status = status;
                    if(progress) job.progress = progress;
                    updateJobElement(job);
                }
            });

            eventSource.onerror = (err) => {
                console.error('EventSource failed:', err);
                const jobQueueDiv = document.getElementById('job-queue');
                jobQueueDiv.innerHTML = '<div style="color: var(--warn);">サーバーとの接続が切れました。ページをリロードしてください。</div>' + jobQueueDiv.innerHTML;
                eventSource.close();
            };
        });

        // --- Actions ---
        async function start() {
            const urlsInput = document.getElementById('urls');
            if (urlsInput.value.trim() === '') {
                alert('URLを入力してください。');
                return;
            }

            const formData = new FormData();
            formData.append('urls', urlsInput.value);
            formData.append('format', document.getElementById('fmt').value);
            formData.append('saveHistory', document.getElementById('optHistory').checked);
            formData.append('downloadThumb', document.getElementById('optThumb').checked);
            formData.append('drmProtect', document.getElementById('optDrm').checked);
            formData.append('savePath', document.getElementById('savePath').value);
            formData.append('parallelDownloads', document.getElementById('optParallelDownloads').value);

            if (window.selectedCookieFile) {
                formData.append('cookieFile', window.selectedCookieFile);
            }

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    alert(`エラー: ${errorData.error}`);
                } else {
                    urlsInput.value = ''; // Clear textarea on success
                }
            } catch (error) {
                alert(`ネットワークエラー: ${error.message}`);
                console.error('Fetch error:', error);
            }
        }
    </script>
</body>
</html>
