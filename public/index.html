<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>LocalTube</title>

    <style>
        :root {
            --bg: #0f0f0f;
            --panel: #181818;
            --border: #303030;
            --text: #f1f1f1;
            --subtext: #aaa;
            --accent: #ff0000;
            --warn: #ff9800;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        /* ===== Header ===== */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: var(--panel);
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .logo {
            font-size: 18px;
            font-weight: bold;
        }

        .logo span {
            color: var(--accent);
        }

        /* ===== Main ===== */
        main {
            max-width: 900px;
            margin: 80px auto 40px;
            padding: 0 16px;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        /* ===== URL ===== */
        .url-box {
            display: flex;
            gap: 10px;
        }

        .url-box input {
            flex: 1;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 24px;
        }

        .url-box button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 0 20px;
            border-radius: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ===== Options ===== */
        .options {
            margin-top: 20px;
            display: grid;
            gap: 14px;
        }

        select {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
        }

        /* ===== Toggle ===== */
        .toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
        }

        .toggle small {
            color: var(--subtext);
            display: block;
            font-size: 12px;
        }

        .switch {
            position: relative;
            width: 42px;
            height: 22px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #555;
            border-radius: 22px;
            cursor: pointer;
            transition: .2s;
        }

        .slider:before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 2px;
            top: 2px;
            background: #fff;
            border-radius: 50%;
            transition: .2s;
        }

        input:checked+.slider {
            background: var(--accent);
        }

        input:checked+.slider:before {
            transform: translateX(20px);
        }

        .warn {
            border-color: var(--warn);
        }

        .warn small {
            color: var(--warn);
        }

        #savePath {
            opacity: 0.9;
        }

        /* ===== Log ===== */
        .log {
            margin-top: 16px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-family: Consolas, monospace;
            font-size: 12px;
            color: #0f0;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo"><span>▶</span> LocalTube</div>
    </header>

    <main>
        <div class="card">

            <div class="url-box">
                <input id="url" placeholder="YouTube の URL を入力">
                <button onclick="start()">DL</button>
            </div>

            <div class="options">

                <!-- 画質指定 -->
                <select id="fmt">
                    <option
                        value="bv[height=4320][ext=mp4]+ba[ext=m4a]/bv[height=2160][ext=mp4]+ba[ext=m4a]/bv[height=1440][ext=mp4]+ba[ext=m4a]/bv[height=1080][ext=mp4]+ba[ext=m4a]/bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        4320p（7680 x 4320）</option>
                    <option
                        value="bv[height=2160][ext=mp4]+ba[ext=m4a]/bv[height=1440][ext=mp4]+ba[ext=m4a]/bv[height=1080][ext=mp4]+ba[ext=m4a]/bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        2160p（3840 x 2160）</option>
                    <option
                        value="bv[height=1440][ext=mp4]+ba[ext=m4a]/bv[height=1080][ext=mp4]+ba[ext=m4a]/bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        1440p（2560 x 1440）</option>
                    <option
                        value="bv[height=1080][ext=mp4]+ba[ext=m4a]/bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        1080p（1920 x 1080）</option>
                    <option
                        value="bv[height=720][ext=mp4]+ba[ext=m4a]/bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        720p （1280 x 720 ）</option>
                    <option
                        value="bv[height=480][ext=mp4]+ba[ext=m4a]/bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        480p （720 x 480 ）</option>
                    <option
                        value="bv[height=360][ext=mp4]+ba[ext=m4a]/bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        360p （640 x 360 ）</option>
                    <option value="bv[height=240][ext=mp4]+ba[ext=m4a]/bv[height=144][ext=mp4]+ba[ext=m4a]">
                        40p （ 426 x 240 ）</option>
                    <option value="bv[height=144][ext=mp4]+ba[ext=m4a]">144p （256 x 144 ）</option>
                </select>
                <div class="url-box">
                    <input type="text" id="savePath" placeholder="保存先フォルダパス (空白の場合、起動.batの親フォルダのdownloadsに保存されます)">
                </div>

                <!-- Cookie -->
                <div class="toggle">
                    <span class="cookie-label">cookieファイルを表示してください</span>
                    <input type="file" id="cookiePathSet" accept=".txt">
                </div>
            </div>


            <!-- 履歴 -->
            <div class="toggle">
                <div>
                    ダウンロード履歴を保存
                    <small>再度同じ動画がダウンロードされないようになります。</small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="optHistory" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <!-- サムネ -->
            <div class="toggle">
                <div>
                    サムネイルをダウンロード
                    <small>動画一覧・再生画面で使用</small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="optThumb" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <!-- DRM protect-->
            <div class="toggle">
                <div>
                    DRM 保護を回避
                    <div class="warn">
                        <small>非推奨（必要なときのみ使用してください。）詳しくは<a
                                href="https://github.com/yt-dlp/yt-dlp/issues/12563">こちら</a>(英語)</small>
                    </div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="optDrm">
                    <span class="slider"></span>
                </label>
            </div>

        </div>

        <div id="log" class="log"></div>

        </div>
    </main>

    <script>
        function openFolder() {
            document.getElementById('cookiePathSet').click();
        }

        document.getElementById('cookiePathSet').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;

            // ファイル名を表示（ブラウザ制限）
            document.getElementById('cookiePath').value = file.name;

            // server.js に送るため保持
            window.selectedCookieFile = file;
        });

    </script>

    <script>
        async function start() {
            const logElement = document.getElementById('log');
            logElement.textContent = ''; // Clear previous logs
            logElement.textContent = 'ダウンロード中... (Downloading...)\n';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url: url.value,
                        format: fmt.value,
                        saveHistory: optHistory.checked,
                        downloadThumb: optThumb.checked,
                        bypassDrm: optDrm.checked,
                        savePath: savePath.value
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    logElement.textContent += `\n成功: ${data.message}\n`;
                    if (data.output) {
                        logElement.textContent += `\nyt-dlp Output:\n${data.output}`;
                    }
                } else {
                    logElement.textContent += `\nエラー: ${data.message || data.error}\n`;
                    if (data.error) {
                        logElement.textContent += `yt-dlp エラー詳細:\n${data.error}`;
                    }
                    if (data.output) {
                        logElement.textContent += `yt-dlp 出力:\n${data.output}`;
                    }
                }
            } catch (error) {
                logElement.textContent += `\nネットワークエラー: ${error.message}\n`;
                console.error('Fetch error:', error);
            }
        }
    </script>

</body>

</html>
